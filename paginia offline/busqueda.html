<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home — Multi-Page Site</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>[x-cloak]{ display:none !important; }</style>
</head>

<body class="pagina-busqueda">
  <header>
    <nav class="navbar bg-body-tertiary">
      <ul>
        <div class="container-fluid">
          <li><a href="index.html">inicio</a></li>
          <li><a href="contacto.html">contacto</a></li>
          <li><a href="busqueda.html">busqueda</a></li>
        </div>
      </ul>
    </nav>
  </header>

  <div x-data="carrerasApp">

    <h1>Encuentre su siguiente camino</h1>

    <div style="padding: 3rem 1.5rem 6rem;width: 100%;">
      <input class="search" type="text" placeholder="buscar por ciudad o localización" x-model="q">
    </div>

    <div class="filters">
      <div>
        <label for="placeFilter">Región</label>
        <select id="placeFilter" x-model="place">
          <option value="">cualquiera</option>
          <option>Valparaíso</option>
          <option>Metropolitana</option>
          <option>O'Higgins</option>
          <option>Maule</option>
          <option>Ñuble</option>
        </select>
      </div>

      <div>
        <label for="dateFilter">Fecha</label>
        <input type="text" id="dateFilter" placeholder="Cualquiera" x-model="date">
      </div>

      <div>
        <label>Distancia</label>
        <div style="display:flex; gap:0.5rem; align-items:left;">
          <input type="number" placeholder="Desde" min="0" x-model="min">
          <span>a</span>
          <input type="number" placeholder="Hasta" min="0" x-model="max">
        </div>
      </div>
    </div>

    <div style="padding: 3rem 1.5rem 6rem;width: 100%;" id="ListaDeCarreras">
      <template x-for="maraton in filtered" :key="maraton.id">
        <div class="race">
          <div class="race-header" @click="toggle(maraton.id)" style="cursor:pointer;">
            <span x-text="maraton.name"></span>
            <span x-text="maraton.date"></span>
            <span class="flecha" x-text="abierto === maraton.id ? '▲' : '▼'"></span>
          </div>

          <div class="detalle" x-show="abierto === maraton.id">
            <p>Lugar: <span x-text="maraton.place"></span></p>
            <p>Distancias: <span x-text="maraton.distances.map(d => d + ' km').join(', ')"></span></p>
            <button type="button" class="btn-registrar" @click="abrirRegistro(maraton)">Registrarse</button>
          </div>
        </div>
      </template>

      <p x-show="cargando">Cargando carreras...</p>
<p x-show="error" x-text="error" style="color:red;"></p>
<p x-show="!cargando && !error && filtered.length === 0">No hay carreras que coincidan.</p>
    </div>

    <!-- Modal: x-show va en un envoltorio, para no pelear con el display:none de Bootstrap -->
    <div x-show="modalAbierto" x-cloak>
      <div class="modal" style="display:block; background:rgba(0,0,0,.5);" @click.self="modalAbierto = false">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Registro</h5>
              <button type="button" class="close" @click="modalAbierto = false">&times;</button>
            </div>
            <div class="modal-body">
              <form @submit.prevent="enviarRegistro()">
                <div class="form-group">
                  <label>Maratón</label>
                  <input type="text" class="form-control" readonly :value="seleccionada ? seleccionada.name : ''">
                </div>
                <div class="form-group">
                  <label>RUT</label>
                  <input type="text" class="form-control" :class="{ 'is-invalid': rutError }"
                  placeholder="Ej: 12345678K" x-model="rut" @input="rutError = ''">
                  <div class="invalid-feedback" x-text="rutError"></div>
</div>
                <div class="form-group">
                  <label>Distancia</label>
                  <select class="form-control" x-model="distanciaElegida">
                    <template x-for="d in (seleccionada ? seleccionada.distances : [])" :key="d">
                      <option :value="d" x-text="d + ' km'"></option>
                    </template>
                  </select>
                </div>
                <button type="submit" class="btn btn-primary">Enviar</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Primero tu JS, después Alpine. Ambos con defer. -->
  <script defer src="js/javascript.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</body>

</html>
